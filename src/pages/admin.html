<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OLE — Admin</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <style>
      #tabContent {
        padding: var(--space-6);
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <span class="brand">OLE</span>
      <h1>Admin · Configuración</h1>
      <span class="role-chip">Manager</span>
      <div class="right">
        <button id="logoutBtn" class="btn-ghost-dark" style="display: none">Cerrar sesión</button>
        <button id="langToggle" class="lang" data-i18n="language.toggle">ES | EN</button>
      </div>
    </header>

    <section id="pinGate">
      <h2>PIN de manager</h2>
      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="• • • •"
      />
      <button id="pinSubmit" class="btn btn-primary">Entrar</button>
      <div id="pinError"></div>
    </section>

    <main id="adminRoot" style="display: none">
      <nav id="tabbar" class="tabbar">
        <button data-tab="resumen">Resumen</button>
        <button data-tab="catalogos">Catálogos</button>
        <button data-tab="configuracion">Configuración</button>
        <button data-tab="datos">Datos</button>
      </nav>
      <section id="tabContent"></section>
    </main>

    <script type="module" src="../modules/admin/page.js"></script>
  </body>
</html>
