<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OLE — Admin</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <style>
      body {
        overflow-x: hidden;
      }
      #tabContent {
        padding: var(--space-6);
      }
      @media (max-width: 720px) {
        #tabContent {
          padding: var(--space-3);
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <span class="brand">OLE</span>
      <h1>Admin · Configuración</h1>
      <span class="role-chip">Manager</span>
      <div class="right">
        <button id="logoutBtn" class="btn-ghost-dark" style="display: none">Cerrar sesión</button>
        <button
          id="langToggle"
          class="lang"
          aria-label="Cambiar idioma"
          data-i18n="language.toggle"
        >
          ES | EN
        </button>
      </div>
    </header>

    <nav class="app-nav" aria-label="Navegación entre pantallas">
      <a href="/">Operador</a>
      <a href="/dashboard">Tablero</a>
      <a href="/graficas">Gráficas</a>
      <a href="/historial">Historial</a>
      <a href="/admin" aria-current="page">Admin</a>
    </nav>

    <section id="pinGate">
      <h2>PIN de manager</h2>
      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="• • • •"
      />
      <button id="pinSubmit" class="btn btn-primary">Entrar</button>
      <div id="pinError"></div>
    </section>

    <main id="adminRoot" style="display: none">
      <nav id="tabbar" class="tabbar" role="tablist" aria-label="Secciones de administración">
        <button role="tab" data-tab="resumen" aria-controls="tabContent">Resumen</button>
        <button role="tab" data-tab="catalogos" aria-controls="tabContent">Catálogos</button>
        <button role="tab" data-tab="configuracion" aria-controls="tabContent">
          Configuración
        </button>
        <button role="tab" data-tab="datos" aria-controls="tabContent">Datos</button>
      </nav>
      <section id="tabContent" role="tabpanel" aria-live="polite"></section>
    </main>

    <script type="module" src="../modules/admin/page.js"></script>
  </body>
</html>
