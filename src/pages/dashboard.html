<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OLE — Tablero de Producción</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/components.css" />
  </head>
  <body>
    <header class="app-header">
      <span class="brand">OLE</span>
      <h1 data-i18n="header.title.dashboard">Tablero de Producción</h1>
      <span class="live-pill">Live · 30 s</span>
      <div class="right">
        <button
          id="refreshBtn"
          class="btn-ghost-dark"
          title="Refrescar"
          aria-label="Refrescar tablero"
        >
          ⟳
        </button>
        <button
          id="langToggle"
          class="lang"
          aria-label="Cambiar idioma"
          data-i18n="language.toggle"
        >
          ES | EN
        </button>
      </div>
    </header>

    <nav class="app-nav" aria-label="Navegación entre pantallas">
      <a href="/">Operador</a>
      <a href="/dashboard" aria-current="page">Tablero</a>
      <a href="/graficas">Gráficas</a>
      <a href="/historial">Historial</a>
      <a href="/admin">Admin</a>
    </nav>

    <div class="summary-strip">
      <div class="summary-tile">
        <span class="label" data-i18n="summary.production">Producción total</span>
        <span class="value" id="summaryProduction">0</span>
      </div>
      <div class="summary-tile">
        <span class="label" data-i18n="summary.scrap">Merma total</span>
        <span class="value" id="summaryScrap">0</span>
      </div>
      <div class="summary-tile">
        <span class="label" data-i18n="summary.lines">Líneas activas</span>
        <span class="value" id="summaryLines">0/0</span>
      </div>
      <div class="summary-tile">
        <span class="label" data-i18n="summary.pace">Pace promedio</span>
        <span class="value" id="summaryPace">0%</span>
      </div>
    </div>

    <main
      id="grid"
      class="dashboard-grid"
      aria-live="polite"
      aria-label="Líneas de producción"
    ></main>
    <script type="module" src="../modules/dashboard/page.js"></script>
  </body>
</html>
