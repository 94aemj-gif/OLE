<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OLE — Gráficas / KPI</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <style>
      select#lineSelect {
        background: rgba(255, 255, 255, 0.06);
        color: var(--header-text);
        border: 1px solid var(--header-divider);
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        font-size: var(--text-sm);
        min-width: 240px;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <span class="brand">OLE</span>
      <h1>Gráficas · KPI</h1>
      <select id="lineSelect" aria-label="Línea seleccionada"></select>
      <div class="right">
        <button
          id="eosBtn"
          class="btn btn-primary"
          style="min-height: 36px"
          aria-label="Abrir resumen de fin de turno"
        >
          Resumen de fin de turno
        </button>
        <button id="refreshBtn" class="btn-ghost-dark" aria-label="Refrescar KPIs">⟳</button>
        <button
          id="langToggle"
          class="lang"
          aria-label="Cambiar idioma"
          data-i18n="language.toggle"
        >
          ES | EN
        </button>
      </div>
    </header>

    <section class="kpi-ribbon">
      <div class="kpi">
        <div class="gauge">
          <svg width="84" height="84" viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="35" stroke="#e2e8f0" stroke-width="8" fill="none" />
            <circle
              id="oeeGauge"
              cx="42"
              cy="42"
              r="35"
              stroke="#3b82f6"
              stroke-width="8"
              fill="none"
              stroke-dasharray="0 220"
              stroke-linecap="round"
              transform="rotate(-90 42 42)"
            />
          </svg>
          <div class="val" id="kpiOee">0%</div>
        </div>
        <div>
          <span class="l">OEE</span>
          <div class="sub">global del turno</div>
        </div>
      </div>
      <div class="kpi">
        <div class="gauge">
          <svg width="84" height="84" viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="35" stroke="#e2e8f0" stroke-width="8" fill="none" />
            <circle
              id="availGauge"
              cx="42"
              cy="42"
              r="35"
              stroke="#16a34a"
              stroke-width="8"
              fill="none"
              stroke-dasharray="0 220"
              stroke-linecap="round"
              transform="rotate(-90 42 42)"
            />
          </svg>
          <div class="val" id="kpiAvailability">0%</div>
        </div>
        <div>
          <span class="l">Disponibilidad</span>
          <div class="sub" id="availSub">—</div>
        </div>
      </div>
      <div class="kpi">
        <div class="gauge">
          <svg width="84" height="84" viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="35" stroke="#e2e8f0" stroke-width="8" fill="none" />
            <circle
              id="perfGauge"
              cx="42"
              cy="42"
              r="35"
              stroke="#f59e0b"
              stroke-width="8"
              fill="none"
              stroke-dasharray="0 220"
              stroke-linecap="round"
              transform="rotate(-90 42 42)"
            />
          </svg>
          <div class="val" id="kpiPerformance">0%</div>
        </div>
        <div>
          <span class="l">Rendimiento</span>
          <div class="sub" id="perfSub">—</div>
        </div>
      </div>
      <div class="kpi">
        <div class="gauge">
          <svg width="84" height="84" viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="35" stroke="#e2e8f0" stroke-width="8" fill="none" />
            <circle
              id="qualGauge"
              cx="42"
              cy="42"
              r="35"
              stroke="#0ea5e9"
              stroke-width="8"
              fill="none"
              stroke-dasharray="0 220"
              stroke-linecap="round"
              transform="rotate(-90 42 42)"
            />
          </svg>
          <div class="val" id="kpiQuality">0%</div>
        </div>
        <div>
          <span class="l">Calidad</span>
          <div class="sub" id="qualSub">—</div>
        </div>
      </div>
    </section>

    <main class="graficas-grid">
      <section>
        <h2>Producción por hora vs objetivo</h2>
        <div class="chart-host"><canvas id="hourlyChart"></canvas></div>
      </section>
      <section>
        <h2>Cumulativo vs objetivo</h2>
        <div class="chart-host"><canvas id="cumulativeChart"></canvas></div>
      </section>
      <section>
        <h2>Merma por hora</h2>
        <div class="chart-host"><canvas id="scrapChart"></canvas></div>
      </section>
      <section class="full">
        <h2>Heatmap 14 días × 24 horas</h2>
        <div id="heatmap"></div>
      </section>
    </main>

    <script type="module" src="../modules/graficas/page.js"></script>
  </body>
</html>
