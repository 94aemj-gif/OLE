<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OLE — Registro de Producción</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/components.css" />
  </head>
  <body>
    <header class="app-header">
      <span class="brand">OLE</span>
      <div>
        <h1 id="lineName">Línea</h1>
        <div class="sub" id="lineSub">Producción · turno actual</div>
      </div>
      <span id="statusPillSlot"></span>
      <div class="right">
        <span class="live-pill">Local · ≤ 30 s</span>
        <button
          id="langToggle"
          class="lang"
          aria-label="Cambiar idioma"
          data-i18n="language.toggle"
        >
          ES | EN
        </button>
      </div>
    </header>

    <main class="operator-grid" aria-labelledby="lineName">
      <section class="operator-hero">
        <p class="h-label" data-i18n="shift.production">Producción del turno</p>
        <div id="counterSlot" class="count" aria-live="polite" aria-label="Unidades producidas">
          0
        </div>
        <div
          class="progress"
          role="progressbar"
          aria-label="Progreso vs objetivo"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span id="progressBar" style="width: 0%"></span>
        </div>
        <div class="meta-row">
          <span>
            <span data-i18n="capture.last">Última captura</span>:
            <strong id="lastCapture">—</strong>
          </span>
          <span>
            <span data-i18n="shift.next.alert">Próxima alerta en</span>
            <strong id="nextAlert">—</strong>
          </span>
        </div>
      </section>

      <aside class="operator-side">
        <div class="side-tile">
          <span class="l">Objetivo</span>
          <span class="v" id="targetTile">—</span>
          <span class="sub" id="targetTileSub">por turno</span>
        </div>
        <div class="side-tile">
          <span class="l">Pace estimado</span>
          <span class="v" id="paceTile">—</span>
          <span class="sub">vs objetivo × horas transcurridas</span>
        </div>
        <div class="side-tile">
          <span class="l">Turno</span>
          <span class="v" id="shiftTile">—</span>
          <span class="sub" id="shiftTileSub">—</span>
        </div>
      </aside>
    </main>

    <div class="cta-stripe">
      <button id="captureBtn" class="btn-cta glow" aria-label="Capturar producción de la hora">
        + &nbsp;<span data-i18n="capture.cta">CAPTURAR</span>
      </button>
    </div>

    <script type="module" src="../modules/page/operator-page.js"></script>
  </body>
</html>
