<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI 01 · 2×2 compact</title>
    <link rel="stylesheet" href="./mobile-mockup-shared.css" />
    <style>
      .header-stub {
        background: var(--header);
        padding: 12px 16px;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid var(--header-divider);
      }
      .subband-stub {
        background: var(--header);
        padding: 8px 12px;
        color: #f1f5f9;
        font-size: 13px;
        border-bottom: 1px solid var(--header-divider);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .grid-2x2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 12px;
      }
      .kpi-cell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 10px;
        align-items: center;
      }
      .kpi-cell .gauge {
        width: 48px;
        height: 48px;
        position: relative;
      }
      .kpi-cell .gauge svg {
        transform: rotate(-90deg);
      }
      .kpi-cell .gauge .val {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 11px;
      }
      .kpi-cell .l {
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .kpi-cell .sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
    </style>
  </head>
  <body class="frame">
    <a class="back" href="/kpi-mockups">← back</a>
    <div class="phone">
      <div class="screen">
        <div class="header-stub">Gráficas · KPI</div>
        <div class="subband-stub">Línea #1 — Jeringa Neomed 60ml<span>▾</span></div>
        <div class="grid-2x2">
          <div class="kpi-cell">
            <div class="gauge">
              <svg width="48" height="48" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="18" stroke="#e2e8f0" stroke-width="6" fill="none" />
                <circle
                  cx="24"
                  cy="24"
                  r="18"
                  stroke="#3b82f6"
                  stroke-width="6"
                  fill="none"
                  stroke-dasharray="30 113"
                  stroke-linecap="round"
                />
              </svg>
              <div class="val">27%</div>
            </div>
            <div>
              <div class="l">OEE</div>
              <div class="sub">global</div>
            </div>
          </div>
          <div class="kpi-cell">
            <div class="gauge">
              <svg width="48" height="48" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="18" stroke="#e2e8f0" stroke-width="6" fill="none" />
                <circle
                  cx="24"
                  cy="24"
                  r="18"
                  stroke="#16a34a"
                  stroke-width="6"
                  fill="none"
                  stroke-dasharray="113 113"
                  stroke-linecap="round"
                />
              </svg>
              <div class="val">100%</div>
            </div>
            <div>
              <div class="l">Disponib.</div>
              <div class="sub">450/450 m</div>
            </div>
          </div>
          <div class="kpi-cell">
            <div class="gauge">
              <svg width="48" height="48" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="18" stroke="#e2e8f0" stroke-width="6" fill="none" />
                <circle
                  cx="24"
                  cy="24"
                  r="18"
                  stroke="#f59e0b"
                  stroke-width="6"
                  fill="none"
                  stroke-dasharray="30 113"
                  stroke-linecap="round"
                />
              </svg>
              <div class="val">27%</div>
            </div>
            <div>
              <div class="l">Rendim.</div>
              <div class="sub">500 / 1875</div>
            </div>
          </div>
          <div class="kpi-cell">
            <div class="gauge">
              <svg width="48" height="48" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="18" stroke="#e2e8f0" stroke-width="6" fill="none" />
                <circle
                  cx="24"
                  cy="24"
                  r="18"
                  stroke="#0ea5e9"
                  stroke-width="6"
                  fill="none"
                  stroke-dasharray="113 113"
                  stroke-linecap="round"
                />
              </svg>
              <div class="val">100%</div>
            </div>
            <div>
              <div class="l">Calidad</div>
              <div class="sub">500 / 500</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
