<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI 03 · Progress bars</title>
    <link rel="stylesheet" href="./mobile-mockup-shared.css" />
    <style>
      .header-stub {
        background: var(--header);
        padding: 12px 16px;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid var(--header-divider);
      }
      .subband-stub {
        background: var(--header);
        padding: 8px 12px;
        color: #f1f5f9;
        font-size: 13px;
        border-bottom: 1px solid var(--header-divider);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .kpi-list {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        margin: 12px;
        overflow: hidden;
      }
      .kpi-row {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .kpi-row:last-child {
        border-bottom: none;
      }
      .kpi-row .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .kpi-row .l {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .kpi-row .v {
        font-weight: 800;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      .kpi-row .sub {
        font-size: 11px;
        color: var(--muted);
      }
      .bar {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        border-radius: 999px;
      }
    </style>
  </head>
  <body class="frame">
    <a class="back" href="/kpi-mockups">← back</a>
    <div class="phone">
      <div class="screen">
        <div class="header-stub">Gráficas · KPI</div>
        <div class="subband-stub">Línea #1 — Jeringa Neomed 60ml<span>▾</span></div>
        <div class="kpi-list">
          <div class="kpi-row">
            <div class="top">
              <span class="l">OEE</span>
              <span class="v">26.7 %</span>
            </div>
            <div class="bar"><span style="width: 26.7%; background: var(--accent)"></span></div>
            <div class="sub" style="margin-top: 4px">global del turno</div>
          </div>
          <div class="kpi-row">
            <div class="top">
              <span class="l">Disponibilidad</span>
              <span class="v" style="color: var(--ok)">100.0 %</span>
            </div>
            <div class="bar"><span style="width: 100%; background: var(--ok)"></span></div>
            <div class="sub" style="margin-top: 4px">450 / 450 min</div>
          </div>
          <div class="kpi-row">
            <div class="top">
              <span class="l">Rendimiento</span>
              <span class="v" style="color: var(--warn)">26.7 %</span>
            </div>
            <div class="bar"><span style="width: 26.7%; background: var(--warn)"></span></div>
            <div class="sub" style="margin-top: 4px">500 / 1 875</div>
          </div>
          <div class="kpi-row">
            <div class="top">
              <span class="l">Calidad</span>
              <span class="v" style="color: #0ea5e9">100.0 %</span>
            </div>
            <div class="bar"><span style="width: 100%; background: #0ea5e9"></span></div>
            <div class="sub" style="margin-top: 4px">500 / 500</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
