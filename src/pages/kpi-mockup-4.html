<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI 04 · Hero OEE + chips</title>
    <link rel="stylesheet" href="./mobile-mockup-shared.css" />
    <style>
      .header-stub {
        background: var(--header);
        padding: 12px 16px;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid var(--header-divider);
      }
      .subband-stub {
        background: var(--header);
        padding: 8px 12px;
        color: #f1f5f9;
        font-size: 13px;
        border-bottom: 1px solid var(--header-divider);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .hero-oee {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        margin: 12px;
        padding: 20px;
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 16px;
        align-items: center;
      }
      .hero-oee .gauge {
        width: 110px;
        height: 110px;
        position: relative;
      }
      .hero-oee .gauge svg {
        transform: rotate(-90deg);
      }
      .hero-oee .gauge .v {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 26px;
      }
      .hero-oee .l {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .hero-oee .sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .chips {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 0 12px 12px;
      }
      .chip {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        text-align: center;
      }
      .chip .l {
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .chip .v {
        font-weight: 800;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }
      .chip .sub {
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }
    </style>
  </head>
  <body class="frame">
    <a class="back" href="/kpi-mockups">← back</a>
    <div class="phone">
      <div class="screen">
        <div class="header-stub">Gráficas · KPI</div>
        <div class="subband-stub">Línea #1 — Jeringa Neomed 60ml<span>▾</span></div>
        <div class="hero-oee">
          <div class="gauge">
            <svg width="110" height="110" viewBox="0 0 110 110">
              <circle cx="55" cy="55" r="46" stroke="#e2e8f0" stroke-width="9" fill="none" />
              <circle
                cx="55"
                cy="55"
                r="46"
                stroke="#3b82f6"
                stroke-width="9"
                fill="none"
                stroke-dasharray="77 289"
                stroke-linecap="round"
              />
            </svg>
            <div class="v">27%</div>
          </div>
          <div>
            <div class="l">OEE global</div>
            <div class="sub">Turno · Vespertino</div>
            <div class="sub" style="margin-top: 8px">↑ 2 % vs ayer</div>
          </div>
        </div>
        <div class="chips">
          <div class="chip">
            <div class="l">Disponib.</div>
            <div class="v" style="color: var(--ok)">100%</div>
            <div class="sub">450/450 m</div>
          </div>
          <div class="chip">
            <div class="l">Rendim.</div>
            <div class="v" style="color: var(--warn)">27%</div>
            <div class="sub">500 / 1875</div>
          </div>
          <div class="chip">
            <div class="l">Calidad</div>
            <div class="v" style="color: #0ea5e9">100%</div>
            <div class="sub">500 / 500</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
