<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI 05 · Stat tiles (no gauges)</title>
    <link rel="stylesheet" href="./mobile-mockup-shared.css" />
    <style>
      .header-stub {
        background: var(--header);
        padding: 12px 16px;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid var(--header-divider);
      }
      .subband-stub {
        background: var(--header);
        padding: 8px 12px;
        color: #f1f5f9;
        font-size: 13px;
        border-bottom: 1px solid var(--header-divider);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 12px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        position: relative;
        overflow: hidden;
      }
      .stat::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--accent);
      }
      .stat.ok::before {
        background: var(--ok);
      }
      .stat.warn::before {
        background: var(--warn);
      }
      .stat.qual::before {
        background: #0ea5e9;
      }
      .stat .l {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .stat .v {
        font-weight: 800;
        font-size: 28px;
        line-height: 1;
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .stat .sub {
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body class="frame">
    <a class="back" href="/kpi-mockups">← back</a>
    <div class="phone">
      <div class="screen">
        <div class="header-stub">Gráficas · KPI</div>
        <div class="subband-stub">Línea #1 — Jeringa Neomed 60ml<span>▾</span></div>
        <div class="grid">
          <div class="stat">
            <div class="l">OEE</div>
            <div class="v">26.7%</div>
            <div class="sub">global del turno</div>
          </div>
          <div class="stat ok">
            <div class="l">Disponib.</div>
            <div class="v" style="color: var(--ok)">100%</div>
            <div class="sub">450/450 min</div>
          </div>
          <div class="stat warn">
            <div class="l">Rendimiento</div>
            <div class="v" style="color: var(--warn)">26.7%</div>
            <div class="sub">500 / 1 875</div>
          </div>
          <div class="stat qual">
            <div class="l">Calidad</div>
            <div class="v" style="color: #0ea5e9">100%</div>
            <div class="sub">500 / 500</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
