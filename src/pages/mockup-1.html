<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup 01 — Evocon Lite</title>
    <style>
      :root {
        --bg: #fafbfc;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --ok: #16a34a;
        --ok-soft: #dcfce7;
        --warn: #f59e0b;
        --warn-soft: #fef3c7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        min-height: 100vh;
      }
      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .topbar .title {
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .topbar .title strong {
        color: var(--text);
        font-weight: 600;
        margin-left: 6px;
      }
      .lang {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        gap: 12px;
      }
      .lang span {
        cursor: pointer;
      }
      .lang span.on {
        color: var(--text);
        font-weight: 600;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 13px;
        background: var(--ok-soft);
        color: var(--ok);
        margin-left: 18px;
      }
      .pill::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.85);
        }
      }
      main {
        max-width: 980px;
        margin: 56px auto 0;
        padding: 0 32px;
      }
      .card {
        background: var(--surface);
        border-radius: 28px;
        padding: 64px 56px;
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 4px 24px rgba(15, 23, 42, 0.04);
      }
      .label {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 32px;
      }
      .counter {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 40px;
      }
      .counter .big {
        font-size: 144px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .counter .target {
        color: var(--muted);
        font-size: 14px;
        text-align: right;
      }
      .counter .target strong {
        display: block;
        color: var(--text);
        font-size: 22px;
        font-weight: 600;
        margin-top: 4px;
      }
      .progress {
        height: 10px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .progress > span {
        display: block;
        height: 100%;
        width: 92%;
        background: var(--accent);
        border-radius: 999px;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 56px;
      }
      .meta strong {
        color: var(--text);
        font-weight: 600;
      }
      .cta {
        display: block;
        width: 100%;
        background: var(--accent);
        color: white;
        padding: 26px;
        border-radius: 999px;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.04em;
        border: none;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
      }
      .footer {
        text-align: center;
        margin-top: 24px;
        color: var(--muted);
        font-size: 13px;
      }
      .back {
        position: fixed;
        top: 18px;
        right: 32px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        background: white;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <a class="back" href="/mockups">← mockups</a>
    <div class="topbar">
      <div>
        <span class="title">Línea <strong>1 · Jeringa Neomed 60ml</strong></span>
        <span class="pill">Running</span>
      </div>
      <div class="lang"><span class="on">ES</span><span>EN</span></div>
    </div>
    <main>
      <div class="card">
        <p class="label">Producción del turno</p>
        <div class="counter">
          <div class="big">1 845</div>
          <div class="target">objetivo<strong>2 000</strong></div>
        </div>
        <div class="progress"><span></span></div>
        <div class="meta">
          <div>Pace <strong>95 %</strong></div>
          <div>Scrap <strong>12</strong></div>
          <div>Downtime <strong>5 min</strong></div>
          <div>Última 14:00 · <strong>240</strong></div>
        </div>
        <button class="cta">+ &nbsp;Capturar</button>
        <p class="footer">Próxima alerta en 23:14</p>
      </div>
    </main>
  </body>
</html>
