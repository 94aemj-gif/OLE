<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup 04 — Glass Cards</title>
    <style>
      :root {
        --text: #1e1b4b;
        --muted: #6b7280;
        --accent: #6366f1;
        --ok: #16a34a;
        --warn: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(at 0% 0%, #c7d2fe 0%, transparent 50%),
          radial-gradient(at 100% 0%, #fbcfe8 0%, transparent 50%),
          radial-gradient(at 50% 100%, #ddd6fe 0%, transparent 60%),
          linear-gradient(180deg, #eef2ff, #fdf4ff);
        background-attachment: fixed;
      }
      .top {
        padding: 22px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
      }
      .top .name {
        font-weight: 600;
      }
      .top .name .num {
        color: var(--accent);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--ok);
        border: 1px solid rgba(22, 163, 74, 0.2);
      }
      .pill::before {
        content: '';
        width: 8px;
        height: 8px;
        background: var(--ok);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--ok);
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      main {
        max-width: 980px;
        margin: 24px auto 120px;
        padding: 0 28px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1.4fr 1fr;
      }
      .tile {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 28px;
        padding: 24px 28px;
        box-shadow:
          0 1px 2px rgba(80, 80, 120, 0.06),
          0 24px 64px rgba(99, 102, 241, 0.08);
      }
      .tile.hero {
        grid-row: span 2;
        display: grid;
        align-content: space-between;
        gap: 16px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0;
      }
      .big {
        font-size: 156px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(140deg, #4338ca, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .units {
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.16em;
        margin-top: 4px;
        text-transform: uppercase;
      }
      .progress {
        height: 10px;
        border-radius: 999px;
        background: rgba(120, 120, 160, 0.15);
        overflow: hidden;
      }
      .progress > span {
        display: block;
        height: 100%;
        width: 92%;
        background: linear-gradient(90deg, var(--accent), #ec4899);
        border-radius: 999px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
      }
      .row strong {
        color: var(--text);
        font-weight: 600;
      }
      .tile h3 {
        margin: 0 0 12px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .oee-val {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 8px;
      }
      .kpis .k {
        background: rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }
      .kpis .k .l {
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .kpis .k .v {
        font-weight: 700;
        font-size: 18px;
      }
      .sparks {
        display: flex;
        gap: 4px;
        align-items: flex-end;
        height: 64px;
      }
      .sparks span {
        flex: 1;
        background: linear-gradient(180deg, var(--accent), rgba(99, 102, 241, 0.3));
        border-radius: 6px 6px 2px 2px;
      }
      .footer-bar {
        position: fixed;
        bottom: 18px;
        left: 24px;
        right: 24px;
        background: rgba(30, 27, 75, 0.95);
        color: white;
        border-radius: 999px;
        padding: 18px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(20px);
        box-shadow: 0 24px 48px rgba(30, 27, 75, 0.25);
      }
      .footer-bar .cta {
        background: white;
        color: var(--text);
        padding: 12px 28px;
        border-radius: 999px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        font-size: 15px;
      }
      .back {
        position: fixed;
        top: 22px;
        right: 28px;
        font-size: 12px;
        text-decoration: none;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <a class="back" href="/mockups">← mockups</a>
    <header class="top">
      <div class="name">Línea <span class="num">#1</span> · Jeringa Neomed 60 ml</div>
      <div style="display: flex; gap: 12px; align-items: center">
        <span class="pill">Running</span>
        <span style="font-size: 13px; color: var(--muted)">ES · EN</span>
      </div>
    </header>
    <main>
      <section class="tile hero">
        <div>
          <p class="label">Producción del turno</p>
          <div class="big">1 845</div>
          <div class="units">unidades · 92 % del objetivo</div>
        </div>
        <div>
          <div class="progress"><span></span></div>
          <div class="row" style="margin-top: 14px">
            <span>Objetivo <strong>2 000</strong></span>
            <span>Pace <strong>95 %</strong></span>
            <span>Última 14:00 · <strong>240</strong></span>
          </div>
        </div>
      </section>

      <section class="tile">
        <h3>OEE</h3>
        <div class="oee-val">83 %</div>
        <div class="kpis">
          <div class="k">
            <div class="l">Avail</div>
            <div class="v">88</div>
          </div>
          <div class="k">
            <div class="l">Perf</div>
            <div class="v">95</div>
          </div>
          <div class="k">
            <div class="l">Qual</div>
            <div class="v">99</div>
          </div>
        </div>
      </section>

      <section class="tile">
        <h3>Hourly</h3>
        <div class="sparks">
          <span style="height: 50%"></span>
          <span style="height: 60%"></span>
          <span style="height: 72%"></span>
          <span style="height: 100%"></span>
          <span style="height: 80%"></span>
          <span style="height: 92%"></span>
          <span style="height: 100%"></span>
          <span style="height: 90%"></span>
        </div>
        <div class="row" style="margin-top: 12px">
          <span>Scrap <strong>12</strong></span>
          <span>Down <strong>5 m</strong></span>
        </div>
      </section>
    </main>
    <div class="footer-bar">
      <span style="font-size: 14px; opacity: 0.7">Operadora · Ana López</span>
      <button class="cta">+ &nbsp;Capturar</button>
    </div>
  </body>
</html>
