<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nav 01 · Bottom tab bar</title>
    <link rel="stylesheet" href="./mobile-mockup-shared.css" />
    <style>
      .hero-card {
        text-align: center;
      }
      .meta-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 12px;
        font-size: var(--t-sm);
        color: var(--muted);
      }
      .meta-row strong {
        color: var(--text);
      }
      .side-tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 0 var(--m-3);
      }
      .side-tiles .tile {
        text-align: center;
      }
      .side-tiles .tile .l {
        font-size: 9px;
        letter-spacing: var(--ls-label);
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .side-tiles .tile .v {
        font-size: var(--t-lead);
        font-weight: 800;
        margin-top: 2px;
      }
      .inline-cta {
        padding: 16px 12px 92px;
      }

      /* Bottom tab bar */
      .tabbar-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
        box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.08);
      }
      .tabbar-bottom a {
        display: grid;
        place-items: center;
        gap: 4px;
        text-decoration: none;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 6px 0;
      }
      .tabbar-bottom a .ico {
        font-size: 22px;
        line-height: 1;
      }
      .tabbar-bottom a.on {
        color: var(--accent);
      }
      .tabbar-bottom a.on::before {
        content: '';
        position: absolute;
        top: -8px;
        width: 36px;
        height: 3px;
        background: var(--accent);
        border-radius: 0 0 var(--r-pill) var(--r-pill);
      }
    </style>
  </head>
  <body class="frame">
    <a class="back" href="/nav-mockups">← nav</a>
    <div class="phone">
      <div class="screen">
        <header class="app-header">
          <span class="dot"></span>
          <span class="title">Línea #1 · Jeringa 60ml</span>
          <button class="lang">ES | EN</button>
        </header>

        <section class="card hero-card">
          <span class="label">Producción del turno</span>
          <div class="num-xl" style="margin: 12px 0">1 845</div>
          <div class="progress"><span style="width: 92%"></span></div>
          <div class="meta-row">
            <span>92 % del objetivo · <strong>2 000</strong></span>
            <span>Última 14:00 · <strong>240</strong></span>
          </div>
        </section>

        <div class="side-tiles">
          <div class="tile">
            <div class="l">Pace</div>
            <div class="v" style="color: var(--ok)">95%</div>
          </div>
          <div class="tile">
            <div class="l">Scrap</div>
            <div class="v" style="color: var(--crit)">12</div>
          </div>
          <div class="tile">
            <div class="l">Turno</div>
            <div class="v">M</div>
          </div>
        </div>

        <div class="inline-cta">
          <button class="btn-cta">+ &nbsp;CAPTURAR</button>
        </div>

        <nav class="tabbar-bottom">
          <a href="#" class="on"><span class="ico">▦</span>Operador</a>
          <a href="#"><span class="ico">📊</span>Tablero</a>
          <a href="#"><span class="ico">📈</span>Gráficas</a>
          <a href="#"><span class="ico">⚙</span>Admin</a>
        </nav>
      </div>
    </div>
  </body>
</html>
