<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nav 02 · Hamburger drawer</title>
    <link rel="stylesheet" href="./mobile-mockup-shared.css" />
    <style>
      .hero-card {
        text-align: center;
      }
      .meta-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 12px;
        font-size: var(--t-sm);
        color: var(--muted);
      }
      .meta-row strong {
        color: var(--text);
      }
      .side-tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 0 var(--m-3);
      }
      .side-tiles .tile {
        text-align: center;
      }
      .side-tiles .tile .l {
        font-size: 9px;
        letter-spacing: var(--ls-label);
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .side-tiles .tile .v {
        font-size: var(--t-lead);
        font-weight: 800;
        margin-top: 2px;
      }
      .cta-stripe {
        padding: 16px 12px 24px;
      }

      /* Hamburger trigger */
      .hamburger {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--header-divider);
        color: var(--header-text);
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        display: grid;
        place-items: center;
        font-family: var(--font);
      }

      /* Drawer */
      .drawer-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(4px);
      }
      .drawer {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        background: var(--surface);
        box-shadow: 8px 0 32px rgba(15, 23, 42, 0.3);
        padding: 22px 0;
        display: grid;
        grid-auto-rows: max-content;
        gap: 4px;
      }
      .drawer .brand-row {
        padding: 0 22px 18px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--muted);
        font-size: 11px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 8px;
      }
      .drawer a {
        text-decoration: none;
        color: var(--text);
        padding: 14px 22px;
        font-size: var(--t-lead);
        font-weight: 600;
        display: flex;
        gap: 12px;
        align-items: center;
        border-left: 3px solid transparent;
      }
      .drawer a .ico {
        font-size: 20px;
        opacity: 0.7;
      }
      .drawer a.on {
        color: var(--accent);
        background: var(--accent-soft);
        border-left-color: var(--accent);
      }
    </style>
  </head>
  <body class="frame">
    <a class="back" href="/nav-mockups">← nav</a>
    <div class="phone">
      <div class="screen">
        <header class="app-header">
          <button class="hamburger" aria-label="Abrir menú">☰</button>
          <span class="dot"></span>
          <span class="title">Línea #1 · Jeringa 60ml</span>
          <button class="lang">ES | EN</button>
        </header>

        <section class="card hero-card">
          <span class="label">Producción del turno</span>
          <div class="num-xl" style="margin: 12px 0">1 845</div>
          <div class="progress"><span style="width: 92%"></span></div>
          <div class="meta-row">
            <span>92 % del objetivo · <strong>2 000</strong></span>
            <span>Última 14:00 · <strong>240</strong></span>
          </div>
        </section>

        <div class="side-tiles">
          <div class="tile">
            <div class="l">Pace</div>
            <div class="v" style="color: var(--ok)">95%</div>
          </div>
          <div class="tile">
            <div class="l">Scrap</div>
            <div class="v" style="color: var(--crit)">12</div>
          </div>
          <div class="tile">
            <div class="l">Turno</div>
            <div class="v">M</div>
          </div>
        </div>

        <div class="cta-stripe">
          <button class="btn-cta">+ &nbsp;CAPTURAR</button>
        </div>

        <!-- Drawer shown for demo -->
        <div class="drawer-backdrop"></div>
        <aside class="drawer">
          <div class="brand-row">OLE</div>
          <a class="on" href="#"><span class="ico">▦</span>Operador</a>
          <a href="#"><span class="ico">📊</span>Tablero</a>
          <a href="#"><span class="ico">📈</span>Gráficas · KPI</a>
          <a href="#"><span class="ico">⚙</span>Admin</a>
        </aside>
      </div>
    </div>
  </body>
</html>
